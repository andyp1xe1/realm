name = "realm"
main = "src/index.ts"
compatibility_date = "2026-10-01"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "realm"

[[d1_databases]]
binding = "DB"
database_name = "realm"
# no database_id: `wrangler deploy` creates the database (and the bucket) on first deploy

[triggers]
crons = ["17 4 * * *"]   # daily cleanup of abandoned uploads and dead links

# secret: `npx wrangler secret put REALM_TOKEN`
