name: release

on:
  push:
    # release versions and their release candidates only, as .githooks/pre-push enforces
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      # A release candidate is a pre-release, which the app never deploys.
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/worker.js dist/worker.json --title "$GITHUB_REF_NAME" --generate-notes
          ${{ contains(github.ref_name, '-rc.') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
