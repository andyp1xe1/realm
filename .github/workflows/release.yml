name: release

on:
  push:
    # release versions and their release candidates only, as .githooks/pre-push enforces
    tags: ["v[0-9]+.[0-9]+.[0-9]+", "v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+"]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: worker
          path: worker/dist/worker.*
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - name: Build the signed APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          REALM_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          REALM_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          REALM_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          REALM_KEYSTORE="$RUNNER_TEMP/release.p12"
          export REALM_KEYSTORE
          base64 -d <<<"$ANDROID_KEYSTORE_BASE64" >"$REALM_KEYSTORE"
          ./gradlew :androidApp:assembleRelease -Prealm.version="${GITHUB_REF_NAME#v}"
          rm "$REALM_KEYSTORE"
          mkdir -p dist
          cp androidApp/build/outputs/apk/release/androidApp-release.apk "dist/realm-$GITHUB_REF_NAME.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: app/dist/*
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :desktopApp:createDistributable :desktopApp:packageUberJarForCurrentOS -Prealm.version="${GITHUB_REF_NAME#v}"
      - name: Install appimagetool
        run: |
          mkdir "$RUNNER_TEMP/bin"
          curl -fsSL -o "$RUNNER_TEMP/bin/appimagetool" https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x "$RUNNER_TEMP/bin/appimagetool"
          echo "$RUNNER_TEMP/bin" >>"$GITHUB_PATH"
      - env:
          # Runners have no FUSE, so appimagetool unpacks itself instead of mounting.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p dist
          desktopApp/packaging/appimage.sh desktopApp/build/compose/binaries/main/app/realm "dist/realm-$GITHUB_REF_NAME-x86_64.AppImage"
          cp desktopApp/build/compose/jars/realm-linux-x64-*.jar "dist/realm-$GITHUB_REF_NAME-linux-x64.jar"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: app/dist/*
          if-no-files-found: error

  release:
    needs: [worker, android, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      # A release candidate is a pre-release, which the app never deploys.
      - run: >-
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          ${{ contains(github.ref_name, '-rc.') && '--prerelease' || '' }}
        env:
          GH_TOKEN: ${{ github.token }}
